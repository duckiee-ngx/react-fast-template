name: CI

on:
  push:
  pull_request:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Filter changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

  ci-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check
      - name: Typecheck
        run: npm run typecheck

  ci-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
      - name: Install dependencies
        run: uv sync --dev
      - name: Check
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy .

  notify-telegram:
    needs: [detect-changes, ci-frontend, ci-backend]
    if: always() && (needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          STATUS="success"
          echo "${{ needs.ci-frontend.result }}" | grep -q failure && STATUS="failure"
          echo "${{ needs.ci-backend.result }}" | grep -q failure && STATUS="failure"

          ICON="✅"
          [ "$STATUS" = "failure" ] && ICON="❌"

          TEXT="<b>${ICON} CI ${STATUS}</b>
          ────────
          Repo: <a href=\"${{ github.server_url }}/${{ github.repository }}">${{ github.repository }}</a>
          Branch: <a href=\"${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}\">${{ github.ref_name }}</a>
          Commit: <a href=\"${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}\">${GITHUB_SHA:0:7}</a>
          Actor: ${{ github.actor }}
          Pipeline: <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">${{ github.run_id }}</a>"

          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d message_thread_id="${THREAD_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode text="${TEXT}"
