server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # cache assets with hash (Vite)
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback — all FE routes to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # optional: do not serve hidden files
  location ~ /\. {
    deny all;
  }
}